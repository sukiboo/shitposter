steps:
  date:
    type: resolve_date
    provider: date
    value: 2026-02-14

  holiday_list:
    type: retrieve_holidays
    provider: checkiday
    inputs: date

  holiday:
    type: choose_holiday
    provider: openai
    model: gpt-5-nano
    inputs: holiday_list
    template: !file ./templates/holiday_selection_prompt.txt

  prompt:
    type: generate_text
    provider: anthropic
    model: claude-sonnet-4-6
    max_tokens: 4096
    budget_tokens: 2048
    inputs: holiday
    template: !file ./templates/holiday_cat_image_prompt.txt

  image:
    type: generate_image
    provider: openai
    model: gpt-image-2
    inputs: prompt
    template: "{prompt}"

  header_emojis:
    type: select_emojis
    provider: openai
    model: gpt-5-mini
    inputs: holiday
    template: !file ./templates/holiday_emoji_prompt.txt

  caption_header:
    type: generate_text
    provider: constant
    inputs: date, holiday, header_emojis
    template: "{date:%B %-d} \u2014 {holiday} {header_emojis}"

  caption_body:
    type: generate_caption
    provider: anthropic
    model: claude-sonnet-4-6
    max_tokens: 4096
    budget_tokens: 2048
    inputs: holiday, prompt, header_emojis
    template: !file ./templates/holiday_cat_caption_prompt.txt

  caption:
    type: generate_text
    provider: constant
    inputs: caption_header, caption_body
    template: "{caption_header}\n{caption_body}"

  publish:
    type: publish_post
    inputs: image, caption
    platforms:
      - debug
